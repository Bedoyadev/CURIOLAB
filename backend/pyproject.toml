[project]
name = "curiolab"
version = "0.1.0"
description = "CURIOLAB: automated 2D animated science Shorts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "anthropic>=1.0.0",
    "elevenlabs>=1.15.0",
    "faster-whisper>=1.1.0",
    "httpx>=0.28.0",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["animation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
